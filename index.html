<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Grocify</title>
  </head>
  <body>
    <div class=" min-h-screen bg-[url('images/Image.png')] bg-center bg-auto bg-no-repeat px-28 py-5">
        <nav class="flex items-center">
            <img src="images/logo.png" alt="logo" class="w-40 cursor-pointer">
            <ul class="flex-1 text-center">
                <li class="list-none inline-block px-5"><a href="#" class="no-underline px-2 text-white">Home</a></li>
                <li class="list-none inline-block px-5"><a href="#" class="no-underline px-2 text-white">About</a></li>
                <li class="list-none inline-block px-5"><a href="#" class="no-underline px-2 text-white">Features</a></li>
                <li class="list-none inline-block px-5"><a href="#" class="no-underline px-2 text-white">Contact</a></li>
            </ul>
            <img src="images/cart.png" alt="cart" class="w-8 cursor-pointer">
        </nav>
        <div class="mt-48 text-white max-w-lg">
            <h1 class="text-6xl font-semibold leading-normal">Groceries <br> delivery in <span class="text-yellow-400 font-thin">15 mins</span></h1>
            <p>Grocify offer a wide range of products, including fresh products, meats, dairy, baked goods and non-perisable items.</p>
            <div class="mt-10">
            <a href="#" class="bg-yellow-300 px-8 py-3 rounded-3xl font-medium  inline-block mr-4 hover:bg-transparent hover:border-yellow-300 hover:text-white duration-300 hover:border border-transparent">Order Now</a>
            <a href="#">Download App <span class="text-lg  inline-block rotate-90">&#10148</span></a>
            </div>
        </div>
        <img src="images/grocery-image.png" alt="hero" class="w-full xl:w-1/2 mt-10 xl:absolute xl:right-0 xl:top-0">
    </div>
